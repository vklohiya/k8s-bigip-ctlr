# This rule is not used by the project k8s-bigip-ctlr itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the cis.f5.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: k8s-bigip-ctlr
    app.kubernetes.io/managed-by: kustomize
  name: transportserver-editor-role
rules:
- apiGroups:
  - cis.f5.com
  resources:
  - transportservers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cis.f5.com
  resources:
  - transportservers/status
  verbs:
  - get
